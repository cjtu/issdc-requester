[project]
name = "issdc"
version = "0.4.0"
description = "ISSDC Pradan Downloader"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Christian J. Tai Udovicic"},
    {name = "Alex Marion"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "requests",
    "tqdm",
]

[project.urls]
Repository = "https://github.com/cjtu/issdc-requester"
Issues = "https://github.com/cjtu/issdc-requester/issues"

[project.scripts]
issdc = "issdc:main_cli"
issdc-index = "issdc_index:main_cli"
issdc-iirs = "issdc_iirs:main_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Flat layout: hatchling infers issdc.py from the project name, but not the second module
# or the index data file, so list them explicitly.
[tool.hatch.build.targets.wheel]
include = ["issdc.py", "issdc_index.py", "issdc_iirs.py", "iirs_index.jsonl"]
